<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishnu Rajan — Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    font-family: 'Barlow Condensed', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .toolbar {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .toolbar-brand {
    font-family: 'Bebas Neue', cursive;
    font-size: 22px;
    letter-spacing: 2px;
    color: #F5A623;
  }
  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #F5A623;
    color: #0a0a0a;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 24px;
    border-radius: 4px;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  .btn-download:hover {
    background: #FFB740;
    transform: translateY(-1px);
  }
  .back-btn {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .back-btn:hover { color: #F5A623; }
  iframe {
    flex: 1;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>

<div class="toolbar">
  <a href="index.html" class="back-btn">
    ← Back to Portfolio
  </a>
  <div class="toolbar-brand">VISHNU RAJAN — RESUME</div>
  <a href="Vishnu_Rajan.pdf" download="Vishnu_Rajan.pdf" class="btn-download">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Download Resume
  </a>
</div>

<iframe src="Vishnu_Rajan.pdf"></iframe>

</body>
</html>
